; XIAO ESP32-C6 needs Arduino core 3.x, which the stock PlatformIO
; espressif32 platform never got — use the pioarduino fork instead.
[env:seeed_xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.31/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.2.3
    lovyan03/LovyanGFX@^1.1.16
    bblanchon/ArduinoJson@^7.0.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
